<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tester Checklist | MySoundLib</title>
  <meta name="description" content="Internal checklist for MySoundLib beta testers.">
  <!-- Internal page for beta testers: keep it out of search engines -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1C1C1C;
      --surface: #242424;
      --surface-light: #2c2c2c;
      --border: rgba(255, 255, 255, 0.1);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --green: #1dcd9f;
      --red: #ff6b6b;
      --amber: #f0b429;
      --text: #ffffff;
      --text-muted: #9e9e9e;
      --text-dim: #666666;
      --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background-color: var(--bg); scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      min-height: 100vh;
      padding: 0 0 80px;
    }

    a { color: inherit; text-decoration: none; }

    .wide { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 28px; }

    /* ── Header ──────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      background: rgba(28, 28, 28, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .nav { height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .nav-brand img { height: 26px; width: auto; display: block; }
    .nav-right { display: flex; align-items: center; gap: 16px; }

    .header-progress {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .header-progress b { color: var(--green); }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 3px 6px;
    }

    .lang-btn {
      background: none;
      border: none;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 100px;
      transition: all 0.15s ease;
    }

    .lang-btn:hover { color: var(--text-muted); }
    .lang-btn.active { background: var(--green); color: #1c1c1c; }

    .progress-track { height: 2px; background: transparent; }
    .progress-fill { height: 2px; width: 0; background: var(--green); transition: width 0.25s ease; }

    /* ── Layout ──────────────────────────────── */
    .container { max-width: 820px; margin: 0 auto; padding: 48px 24px 0; }

    .meta-tag { font-size: 12px; font-weight: 700; color: var(--green); letter-spacing: 0.04em; margin-bottom: 12px; }

    h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 16px; }

    .lead { font-size: 16px; color: var(--text-muted); margin-bottom: 32px; }

    code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      overflow-wrap: anywhere;
    }

    kbd {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 0 6px;
      color: var(--text);
      white-space: nowrap;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; }

    /* ── Tester info form ────────────────────── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }

    .field input, .field select, textarea {
      width: 100%;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .field input:focus, .field select:focus, textarea:focus { border-color: var(--green); }
    .field select { appearance: none; -webkit-appearance: none; cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
      background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }

    /* ── Tips (collapsed by default) ─────────── */
    .tips-box { margin-bottom: 28px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 14px; }
    .tips-box summary {
      font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
      list-style: none; display: inline-flex; align-items: center; gap: 8px;
    }
    .tips-box summary::-webkit-details-marker { display: none; }
    .tips-box summary::before { content: '›'; font-size: 16px; line-height: 1; transition: transform 0.15s ease; }
    .tips-box[open] summary::before { transform: rotate(90deg); }
    .tips-box summary:hover { color: var(--text); }
    .tips { list-style: none; display: grid; gap: 6px; margin-top: 12px; }
    .tips li { font-size: 13.5px; color: var(--text-muted); padding-left: 16px; position: relative; }
    .tips li::before { content: ''; position: absolute; left: 2px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-dim); }
    .tips b { color: var(--text); font-weight: 600; }

    /* ── Summary (one quiet line) ────────────── */
    .summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }
    .summary b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
    .summary .sum { display: inline-flex; align-items: center; gap: 6px; }
    .summary .sum.ok::before, .summary .sum.fail::before, .summary .sum.skip::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
    }
    .summary .sum.ok::before { background: var(--green); }
    .summary .sum.fail::before { background: var(--red); }
    .summary .sum.skip::before { background: var(--amber); }

    /* ── Sections ────────────────────────────── */
    .section { margin-bottom: 30px; }

    .section-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .section-head h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .section-count { font-size: 12px; font-weight: 600; color: var(--text-dim); margin-left: auto; font-variant-numeric: tabular-nums; }

    .chip {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-dim);
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      padding: 0 8px;
      white-space: nowrap;
    }

    .chip.important { color: var(--amber); border-color: rgba(240, 180, 41, 0.3); }

    /* One container per section, items separated by hairlines */
    .list { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 12px; }

    .item {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      column-gap: 14px;
      align-items: start;
      padding: 14px 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .item:first-child { border-top: 0; }

    .item-num { font-size: 12px; font-weight: 600; color: var(--text-dim); padding-top: 2px; font-variant-numeric: tabular-nums; transition: color 0.15s ease; }
    .item[data-status="ok"] .item-num { color: var(--green); }
    .item[data-status="fail"] .item-num { color: var(--red); }
    .item[data-status="skip"] .item-num { color: var(--amber); }

    .item-text { font-size: 14px; color: #d6d6d6; line-height: 1.6; }

    .item-actions { display: flex; align-items: center; gap: 4px; }

    .seg { display: inline-flex; gap: 2px; }

    .seg button, .note-btn {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      background: none;
      border: none;
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
      transition: all 0.12s ease;
      min-height: 28px;
      white-space: nowrap;
    }

    .seg button:hover, .note-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
    .seg button[aria-pressed="true"][data-v="ok"] { background: rgba(29, 205, 159, 0.14); color: var(--green); }
    .seg button[aria-pressed="true"][data-v="fail"] { background: rgba(255, 107, 107, 0.14); color: var(--red); }
    .seg button[aria-pressed="true"][data-v="skip"] { background: rgba(240, 180, 41, 0.14); color: var(--amber); }

    .note-btn { margin-left: 4px; }
    .note-btn.has-note { color: var(--text-muted); }

    .note-wrap { grid-column: 2 / -1; margin-top: 10px; }
    .note-wrap[hidden] { display: none; }
    textarea { min-height: 64px; resize: vertical; font-size: 13.5px; line-height: 1.5; background: var(--bg); }

    /* ── Report ──────────────────────────────── */
    .report-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .btn-solid { background: var(--green); color: #0b0b0e; }
    .btn-solid:hover { background: #25e0b0; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--text-muted); }
    .btn-danger { background: transparent; color: var(--text-muted); border-color: transparent; margin-left: auto; }
    .btn-danger:hover { color: var(--red); }

    .report-card p { font-size: 14px; color: var(--text-muted); }
    .warn { color: var(--amber) !important; font-size: 13px !important; margin-top: 10px; }
    .warn[hidden] { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 100px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer a { color: var(--text-muted); }
    .footer a:hover { color: var(--green); }

    @media (max-width: 640px) {
      .wide { padding: 0 16px; }
      .container { padding: 32px 16px 0; }
      .form-grid { grid-template-columns: 1fr; }
      .header-progress { display: none; }
      .item { grid-template-columns: 22px 1fr; column-gap: 10px; padding: 14px; }
      .item-actions { grid-column: 2 / -1; margin-top: 8px; margin-left: -9px; }
      .btn-danger { margin-left: 0; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="wide">
      <nav class="nav" aria-label="Main Navigation">
        <a href="index.html" class="nav-brand" aria-label="MySoundLib home">
          <img src="static/logo.svg" alt="MySoundLib">
        </a>
        <div class="nav-right">
          <span class="header-progress" id="headerProgress"></span>
          <div class="lang-switcher">
            <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
            <button class="lang-btn" id="btnPT" onclick="setLang('pt')">PT</button>
          </div>
        </div>
      </nav>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>

  <div class="container">
    <main>
      <div class="meta-tag" data-t="metaTag"></div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>

      <!-- Tester info -->
      <div class="card">
        <div class="card-title" data-t="infoTitle"></div>
        <div class="form-grid">
          <div class="field">
            <label for="fName" data-t="fName"></label>
            <input id="fName" type="text" autocomplete="name">
          </div>
          <div class="field">
            <label for="fComputer" data-t="fComputer"></label>
            <select id="fComputer">
              <option value="" data-t="optChoose"></option>
              <option value="mac-arm">Mac (Apple Silicon)</option>
              <option value="mac-intel">Mac (Intel)</option>
              <option value="windows">Windows</option>
              <option value="linux">Linux</option>
            </select>
          </div>
          <div class="field">
            <label for="fSystem" data-t="fSystem"></label>
            <input id="fSystem" type="text">
          </div>
          <div class="field">
            <label for="fApp" data-t="fApp"></label>
            <input id="fApp" type="text">
          </div>
        </div>
      </div>

      <!-- Tips -->
      <details class="tips-box">
        <summary data-t="tipsTitle"></summary>
        <ul class="tips">
          <li data-t="tip1"></li>
          <li data-t="tip2"></li>
          <li data-t="tip3"></li>
          <li data-t="tip4"></li>
        </ul>
      </details>

      <!-- Summary -->
      <div class="summary" aria-live="polite">
        <span class="sum"><b id="sTotal">0</b> <span data-t="sTested"></span></span>
        <span class="sum ok"><b id="sOk">0</b> <span data-t="sOk"></span></span>
        <span class="sum fail"><b id="sFail">0</b> <span data-t="sFail"></span></span>
        <span class="sum skip"><b id="sSkip">0</b> <span data-t="sSkip"></span></span>
      </div>

      <!-- Checklist (rendered from CHECKLIST below) -->
      <div id="checklist"></div>

      <!-- Report -->
      <div class="card report-card" id="report">
        <div class="card-title" data-t="reportTitle"></div>
        <p data-t="reportText"></p>
        <p class="warn" id="reportWarn" hidden></p>
        <div class="report-actions">
          <button class="btn btn-solid" id="btnCopy" data-t="btnCopy"></button>
          <button class="btn btn-ghost" id="btnDownload" data-t="btnDownload"></button>
          <button class="btn btn-danger" id="btnReset" data-t="btnReset"></button>
        </div>
      </div>

      <div class="footer">
        <span>&copy; MySoundLib</span>
        <a href="index.html" data-t="footerBack"></a>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

        ]
      },
      {
        id: 'i18n', platform: 'all',
        en: 'Translations (PT-BR, ES, HI)', pt: 'Traduções (PT-BR, ES, HI)',
        items: [
          { id: 'tl-english-left',
            en: 'Use the app in each language and look for text still in English in: the status bar, context menus (Library, files, groups, tags), buttons, tooltips, confirmation and error dialogs, conversion options (sample rate/bitrate) and "Mono/Stereo".',
            pt: 'Use o app em cada idioma e procure textos que ainda estejam em inglês em: barra de status, menus de contexto (Biblioteca, arquivos, grupos, tags), botões, dicas (tooltips), janelas de confirmação e erro, opções de conversão (taxa de amostragem/bitrate) e "Mono/Estéreo".' },
          { id: 'tl-placeholders',
            en: 'Messages with names or numbers must show the right values, with no literal <code>{count}</code> or <code>{name}</code>.',
            pt: 'Mensagens com nomes ou números devem mostrar os valores certos, sem <code>{count}</code> ou <code>{name}</code> aparecendo literalmente.' }
        ]
      },
      {
        id: 'regression', platform: 'Windows / Linux',
        en: 'Windows and Linux regression', pt: 'Regressão no Windows e no Linux',
        items: [
          { id: 'rg-basic',
            en: 'Basic flow: launch, scan, play, drag to the DAW, QuickSearch (<kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>F</kbd>), delete to the Recycle Bin, and reveal in Explorer/file manager.',
            pt: 'Fluxo básico: abrir o app, escanear, tocar, arrastar para o DAW, QuickSearch (<kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>F</kbd>), apagar para a Lixeira e mostrar no Explorer/gerenciador de arquivos.' },
          { id: 'rg-storage',
            en: 'Data stays in <code>Documents\\MySoundLib</code>, with no migration.',
            pt: 'Os dados continuam em <code>Documentos\\MySoundLib</code>, sem nenhuma migração.' }
        ]

    ];

    const PLATFORM_LABEL = {
      all: { en: 'All platforms', pt: 'Todas as plataformas' },
      macOS: { en: 'macOS', pt: 'macOS' },
      'Windows / Linux': { en: 'Windows / Linux', pt: 'Windows / Linux' }
    };
    const IMPORTANT_LABEL = { en: 'Important', pt: 'Importante' };

    /* ── State (per browser) ─────────────────── */
    const STORE_KEY = 'msl_beta_checklist_v1';
    let state = { info: {}, items: {} };   // items[id] = { s: 'ok'|'fail'|'skip', n: 'note' }
    let lang = 'en';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.info = parsed.info || {};
          state.items = parsed.items || {};
        }
      } catch (e) {}
    }

    function saveState() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function itemState(id) {
      return state.items[id] || { s: '', n: '' };
    }

    function setItem(id, patch) {
      const cur = itemState(id);
      const next = Object.assign({}, cur, patch);
      if (!next.s && !next.n) delete state.items[id];
      else state.items[id] = next;
      saveState();
    }

    /* ── Rendering ───────────────────────────── */
    function allItems() {
      const out = [];
      CHECKLIST.forEach((sec, si) => sec.items.forEach((it, ii) => out.push({ sec, it, num: (si + 1) + '.' + (ii + 1) })));
      return out;
    }

    function render() {
      const t = UI[lang];
      const root = document.getElementById('checklist');
      root.innerHTML = '';

      CHECKLIST.forEach((sec, si) => {
        const section = document.createElement('section');
        section.className = 'section';
        section.id = 'sec-' + sec.id;

        const head = document.createElement('div');
        head.className = 'section-head';
        head.innerHTML =
          '<h2>' + (si + 1) + '. ' + sec[lang] + '</h2>' +
          '<span class="chip">' + PLATFORM_LABEL[sec.platform][lang] + '</span>' +
          (sec.important ? '<span class="chip important">' + IMPORTANT_LABEL[lang] + '</span>' : '') +
          '<span class="section-count" data-count="' + sec.id + '"></span>';
        section.appendChild(head);

        const list = document.createElement('div');
        list.className = 'list';
        section.appendChild(list);

        sec.items.forEach((it, ii) => {
          const st = itemState(it.id);
          const card = document.createElement('div');
          card.className = 'item';
          card.dataset.status = st.s;
          card.dataset.id = it.id;

          card.innerHTML =
            '<span class="item-num">' + (si + 1) + '.' + (ii + 1) + '</span>' +
            '<div class="item-text">' + it[lang] + '</div>' +
            '<div class="item-actions">' +
              '<div class="seg" role="group">' +
                ['ok', 'fail', 'skip'].map(v =>
                  '<button type="button" data-v="' + v + '" aria-pressed="' + (st.s === v) + '">' +
                  t[v === 'ok' ? 'stOk' : v === 'fail' ? 'stFail' : 'stSkip'] + '</button>').join('') +
              '</div>' +
              '<button type="button" class="note-btn' + (st.n ? ' has-note' : '') + '">' + (st.n ? t.noteEdit : t.noteAdd) + '</button>' +
            '</div>' +
            '<div class="note-wrap"' + (st.n || st.s === 'fail' ? '' : ' hidden') + '>' +
              '<textarea placeholder="' + t.notePh + '" aria-label="' + t.noteEdit + ' ' + (si + 1) + '.' + (ii + 1) + '"></textarea>' +
            '</div>';

          card.querySelector('textarea').value = st.n || '';
          list.appendChild(card);
        });

        root.appendChild(section);
      });

      updateCounts();
    }

    function updateCounts() {
      const t = UI[lang];
      const items = allItems();
      let ok = 0, fail = 0, skip = 0;
      items.forEach(({ it }) => {
        const s = itemState(it.id).s;
        if (s === 'ok') ok++;
        else if (s === 'fail') fail++;
        else if (s === 'skip') skip++;
      });
      const done = ok + fail + skip;
      const total = items.length;

      document.getElementById('sTotal').textContent = done + ' / ' + total;
      document.getElementById('sOk').textContent = ok;
      document.getElementById('sFail').textContent = fail;
      document.getElementById('sSkip').textContent = skip;
      document.getElementById('headerProgress').innerHTML = t.headerProgress.replace('{done}', done).replace('{total}', total);
      document.getElementById('progressFill').style.width = (total ? (done / total * 100) : 0) + '%';

      CHECKLIST.forEach(sec => {
        const n = sec.items.filter(it => itemState(it.id).s).length;
        const el = document.querySelector('[data-count="' + sec.id + '"]');
        if (el) el.textContent = n + ' / ' + sec.items.length;
      });
    }

    /* ── Events (delegated) ──────────────────── */
    document.getElementById('checklist').addEventListener('click', e => {
      const card = e.target.closest('.item');
      if (!card) return;
      const id = card.dataset.id;
      const t = UI[lang];

      const segBtn = e.target.closest('.seg button');
      if (segBtn) {
        const v = segBtn.dataset.v;
        const next = itemState(id).s === v ? '' : v;   // click again to clear
        setItem(id, { s: next });
        card.dataset.status = next;
        card.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === next)));
        if (next === 'fail') {
          const wrap = card.querySelector('.note-wrap');
          wrap.hidden = false;
          wrap.querySelector('textarea').focus();
        }
        updateCounts();
        return;
      }

      if (e.target.closest('.note-btn')) {
        const wrap = card.querySelector('.note-wrap');
        wrap.hidden = !wrap.hidden;
        if (!wrap.hidden) wrap.querySelector('textarea').focus();
      }
    });

    document.getElementById('checklist').addEventListener('input', e => {
      if (e.target.tagName !== 'TEXTAREA') return;
      const card = e.target.closest('.item');
      const t = UI[lang];
      const val = e.target.value;
      setItem(card.dataset.id, { n: val });
      const btn = card.querySelector('.note-btn');
      btn.classList.toggle('has-note', !!val.trim());
      btn.textContent = val.trim() ? t.noteEdit : t.noteAdd;
    });

    const INFO_FIELDS = { fName: 'name', fComputer: 'computer', fSystem: 'system', fApp: 'app' };
    Object.entries(INFO_FIELDS).forEach(([elId, key]) => {
      const el = document.getElementById(elId);
      el.addEventListener('input', () => {
        state.info[key] = el.value;
        saveState();
        document.getElementById('reportWarn').hidden = true;
      });
    });

    function fillInfoFields() {
      Object.entries(INFO_FIELDS).forEach(([elId, key]) => {
        document.getElementById(elId).value = state.info[key] || '';
      });
    }

    /* ── Report ──────────────────────────────── */
    function htmlToText(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      return div.textContent.replace(/\s+/g, ' ').trim();
    }

    function computerLabel(v) {
      const opt = document.querySelector('#fComputer option[value="' + v + '"]');
      return v && opt ? opt.textContent : '-';
    }

    function buildReport() {
      const t = UI[lang];
      const items = allItems();
      const counts = { ok: 0, fail: 0, skip: 0, '': 0 };
      items.forEach(({ it }) => counts[itemState(it.id).s || '']++);

      const line = '='.repeat(60);
      const out = [];
      out.push(t.rTitle, line);
      out.push(t.rTester + ': ' + (state.info.name || '-'));
      out.push(t.rComputer + ': ' + computerLabel(state.info.computer));
      out.push(t.rSystem + ': ' + (state.info.system || '-'));
      out.push(t.rApp + ': ' + (state.info.app || '-'));
      out.push(t.rDate + ': ' + new Date().toLocaleString(lang === 'pt' ? 'pt-BR' : 'en-US'));
      out.push('');
      out.push(t.rSummary + ': OK ' + counts.ok + ' | ' + t.sFail + ' ' + counts.fail +
               ' | ' + t.sSkip + ' ' + counts.skip + ' | ' + t.rNotTested + ' ' + counts['']);
      out.push('');

      out.push(t.rFailures, '-'.repeat(60));
      const failures = items.filter(({ it }) => itemState(it.id).s === 'fail');
      if (!failures.length) out.push(t.rNoFailures);
      failures.forEach(({ it, num }) => {
        out.push('[' + num + '] ' + htmlToText(it[lang]));
        const n = (itemState(it.id).n || '').trim();
        if (n) out.push('    ' + t.rNote + ': ' + n.replace(/\n/g, '\n    '));
        out.push('');
      });
      out.push('');

      out.push(t.rAll, '-'.repeat(60));
      CHECKLIST.forEach((sec, si) => {
        out.push('');
        out.push((si + 1) + '. ' + sec[lang] + ' (' + PLATFORM_LABEL[sec.platform][lang] + ')');
        sec.items.forEach((it, ii) => {
          const st = itemState(it.id);
          const status = t.rStatus[st.s || ''];
          out.push('  [' + status + '] ' + (si + 1) + '.' + (ii + 1) + ' ' + htmlToText(it[lang]));
          const n = (st.n || '').trim();
          if (n && st.s !== 'fail') out.push('      ' + t.rNote + ': ' + n.replace(/\n/g, '\n      '));
        });
      });

      return out.join('\n') + '\n';
    }

    function checkInfo() {
      const missing = !(state.info.name || '').trim() || !state.info.computer;
      const warn = document.getElementById('reportWarn');
      warn.textContent = UI[lang].warnMissing;
      warn.hidden = !missing;
      return !missing;
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2400);
    }

    document.getElementById('btnCopy').addEventListener('click', async () => {
      checkInfo();
      const text = buildReport();
      try {
        await navigator.clipboard.writeText(text);
        toast(UI[lang].toastCopied);
      } catch (e) {
        // Fallback for browsers without async clipboard access
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) {}
        ta.remove();
        toast(ok ? UI[lang].toastCopied : UI[lang].toastCopyFail);
      }
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      checkInfo();
      const text = buildReport();
      const who = (state.info.name || 'tester').trim().replace(/[^\w\-]+/g, '_').slice(0, 40) || 'tester';
      const date = new Date().toISOString().slice(0, 10);
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'MySoundLib_beta_report_' + who + '_' + date + '.txt';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      if (!confirm(UI[lang].confirmReset)) return;
      state = { info: {}, items: {} };
      saveState();
      fillInfoFields();
      document.getElementById('reportWarn').hidden = true;
      render();
      toast(UI[lang].toastReset);
    });

    /* ── Language ────────────────────────────── */
    function setLang(next, persist = true) {
      if (!UI[next]) next = 'en';
      lang = next;
      const t = UI[lang];
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
      document.title = t.title + ' | MySoundLib';
      ['EN', 'PT'].forEach(code => {
        document.getElementById('btn' + code).classList.toggle('active', lang === code.toLowerCase());
      });
      document.querySelectorAll('[data-t]').forEach(el => {
        const v = t[el.dataset.t];
        if (v !== undefined) el.innerHTML = v;
      });
      if (!document.getElementById('reportWarn').hidden) checkInfo();
      render();
      if (persist) { try { localStorage.setItem('msl_lang', lang); } catch (e) {} }
    }

    /* ── Init ────────────────────────────────── */
    loadState();
    fillInfoFields();
    (function () {
      let saved = null;
      try { saved = localStorage.getItem('msl_lang'); } catch (e) {}
      if (saved === 'en' || saved === 'pt') { setLang(saved); return; }
      // ES/HI visitors of the main site get English here (the checklist exists in EN and PT only)
      const navLang = (navigator.language || '').toLowerCase();
      setLang(navLang.startsWith('pt') ? 'pt' : 'en', false);
    })();
  </script>
